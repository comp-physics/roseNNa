name: CI

on:
  # all branches
  push:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  CI_test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Clone roseNNa
        uses: actions/checkout@v4

      - name: Set up gfortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - name: Check gfortran version
        run: gfortran --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python package tests
        run: |
          pip install -e python
          cd python && python3 -m pytest tests -v

      - name: Device-path tests ran on the host (not skipped)
        run: |
          cd python && python3 -m pytest tests/test_device_c.py -v -rs 2>&1 | tee device.log
          ! grep -q "SKIPPED" device.log

      - name: Run test cases
        run: |
          mkdir -p fLibrary/objFiles
          chmod +x test/run.sh
          cd test && ./run.sh
